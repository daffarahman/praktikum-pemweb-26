<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="js/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header id="header">
    </header>

    <main class="mx-8">

        <!-- Hero -->
        <section class="flex flex-col gap-8 items-center justify-center m-8">
            <h1 class="text-4xl">SF one day? Omw to the Valley</h1>
            <img class="object-cover rounded-[32px]" src="https://pydata.org/sfo2016/static/images/banner-sfo2016.jpg"
                alt="SFO">
        </section>

        <!-- Project List -->
        <section class="overflow-hidden rounded-2xl flex flex-col items-center justify-center gap-8">
            <h1 class="text-4xl">Hope these projects will qualify</h1>
            <p class="text-slate-600 max-w-2xl text-center">
                List of projects I have on GitHub. It is taken from api.github.com. Please click one of them for more
                details.
            </p>

            <div class="w-full max-w-2xl overflow-x-auto">
                <table class="w-full min-w-[672px] text-center text-xl">
                    <thead class="text-xl bg-slate-200">
                        <tr>
                            <th scope="col" class="px-6 py-3 w-1/4">Project</th>
                            <th scope="col" class="px-6 py-3">Description</th>
                        </tr>
                    </thead>
                    <tbody id="project-list" class="bg-white">
                        <tr id="loading-row">
                            <td colspan="2" class="px-6 py-8 text-center font-medium text-slate-600 animate-pulse">
                                Loading projects...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="flex flex-col gap-8 items-center justify-center m-8 mt-20">
        <h1 class="text-4xl">Amen to that</h1>
        <img class="object-cover rounded-[32px]"
            src="https://t3.ftcdn.net/jpg/02/97/72/84/360_F_297728440_gMsIK3Qq6gkbuynZXcjWFWBB9OgQ4NRa.jpg"
            alt="Golden gate">
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
