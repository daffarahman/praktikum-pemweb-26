<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macintosh Simulator Made By Dap</title>

    <!-- Local Jquery -->
    <script src="js/jquery.min.js"></script>

    <!-- Saya menggunakan tailwindcss untuk styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Dan custom css juga untuk font Montserrat -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex flex-col gap-8 items-center justify-center pt-16 bg-slate-100 text-black font-mono">

    <header class="flex flex-col gap-1 items-center justify-center">
        <h1 class="text-4xl font-bold">Macintosh Simulator</h1>
        <a class="text-xl text-slate-600 hover:underline" href="https://madebydap.com" target="_blank">madebydap.com</a>
    </header>

    <main class="bg-amber-200 w-[512px] h-[640px] mx-auto rounded-2xl">
        <section class="main-screen bg-white m-8 rounded-lg h-[320px] flex flex-col overflow-hidden select-none">

            <!-- Menu Bar -->
            <div class="menu-bar flex gap-2 pl-2 border-b-2 border-black bg-white text-xs py-1">
                <p class="menu-item cursor-pointer hover:bg-black hover:text-white px-2 rounded font-bold"
                    data-target="app-notes">WordPerfect</p>
                <p class="menu-item cursor-pointer hover:bg-black hover:text-white px-2 rounded" data-target="app-calc">
                    Calc</p>
                <p class="menu-item cursor-pointer hover:bg-black hover:text-white px-2 rounded" data-target="app-draw">
                    MacPaint</p>
                <p class="menu-item cursor-pointer hover:bg-black hover:text-white px-2 rounded" data-target="app-help">
                    Help</p>
            </div>

            <div class="desktop p-3 flex-1 bg-slate-50 overflow-hidden relative text-xs">

                <!-- WordPerfect / Notes -->
                <!-- I just love the name wordperfect, since it's revolutionized desktop publishing on Mac -->
                <div id="app-notes" class="app-section flex flex-col gap-2 h-full">
                    <h1 class="text-2xl">WordPerfect for Mac</h1>
                    <div class="flex-1 border-2 border-black p-2 bg-white overflow-y-auto rounded-sm">
                        <p class="text-md">
                            Note to self:</p>
                        <p id="note-output" class="italic text-xl"></p>
                    </div>
                    <div class="flex flex-col gap-1">
                        <input type="text" id="note-input"
                            class="border-2 border-black p-1 rounded-md text-xs bg-white outline-none w-full"
                            placeholder="Write something . . .">
                        <button id="save-note-btn"
                            class="w-full bg-white hover:bg-black hover:text-white border-2 rounded-sm border-black text-[11px] font-bold py-0.5 px-2 self-start cursor-pointer">Save</button>
                    </div>
                </div>

                <!-- Calculator App -->
                <div id="app-calc"
                    class="app-section hidden flex flex-col gap-2 mx-auto w-[160px] border-2 border-black p-2 bg-white rounded-md">
                    <div id="calc-screen"
                        class="border-2 border-black p-1 text-right text-sm font-bold bg-white h-7 overflow-hidden rounded-md">
                        0
                    </div>
                    <div id="calc-buttons-container" class="grid grid-cols-4 gap-1"></div>
                </div>

                <!-- MacPaint -->
                <div id="app-draw" class="app-section hidden flex flex-col gap-1 h-full">
                    <div class="flex justify-between items-center">
                        <h1 class="text-2xl">MacPaint</h1>
                        <button id="clear-canvas"
                            class="border border-black px-2 py-0.5 bg-white hover:bg-black hover:text-white cursor-pointer text-[10px] rounded-sm">Clear</button>
                    </div>
                    <canvas id="paint-canvas" width="440" height="200"
                        class="border-2 border-black bg-white cursor-crosshair flex-1 rounded-lg"></canvas>
                </div>

                <!-- Help App -->
                <div id="app-help"
                    class="app-section hidden flex flex-col gap-2 h-full bg-white border-2 border-black p-3 overflow-y-auto">
                    <p class="font-bold text-xl">Macintosh User Manual</p>
                    <p class="leading-relaxed text-md">
                        1. Click on the menu bar apps using your mouse<br>
                        2. That's it, that's how easy a mac is, as easy as 123
                    </p>
                </div>
            </div>
        </section>
    </main>

    <script>
        // When the document is ready
        $(document).ready(function () {

            // Tombol-tombol di kalkulator
            const calcButtons = [
                '7', '8', '9', '+',
                '4', '5', '6', '-',
                '1', '2', '3', '*',
                'C', '0', '=', '/'
            ];

            // Selector id untuk container tombol kalkulator
            const $btnContainer = $('#calc-buttons-container');

            // Untuk setiap tombol...
            calcButtons.forEach(function (btn) {
                // Tambahkan ke container dalam bentuk button
                $btnContainer.append(
                    `<button class="calc-btn border border-black bg-white rounded-md hover:bg-black hover:text-white p-1 text-center cursor-pointer">${btn}</button>`
                );
            });


            // Onclick untuk selector class .menu-item
            $('.menu-item').on('click', function () {
                $('.menu-item').removeClass('font-bold');
                $(this).addClass('font-bold');

                // Melakukan GET, attribute dan text
                let targetApp = $(this).attr('data-target');
                let appName = $(this).text();

                $('.app-section').addClass('hidden');
                $('#' + targetApp).removeClass('hidden');
            });

            // Tombol save di aplikasi notes
            $('#save-note-btn').on('click', function () {
                // Mengambil isi dari #note-input
                let textInput = $('#note-input').val();

                // apabila tidak kosong maka
                if (textInput.trim() !== "") {
                    // set isi text dari #note-output menjadi apa yang ada di inputan #note-input
                    $('#note-output').text(textInput);
                    // Kosongkan #note-input
                    $('#note-input').val("");
                }
            });

            // Ekspresi perhitungan kalkulator
            let calcExpression = "";

            // Ketika salah satu tombol di kliik
            $(document).on('click', '.calc-btn', function () {
                let btnValue = $(this).text(); // GET nilai dari elemen tombol yang diklik

                // Tombol reset
                if (btnValue === 'C') {
                    // Saat reset, hapus isi ekspresi dan set layar kalkulator ke 0
                    calcExpression = "";
                    $('#calc-screen').text("0");

                    // Apabila diklik tombol "=" atau hasil
                } else if (btnValue === '=') {
                    try {
                        if (calcExpression !== "") {
                            // Hitung menggunakan JavaScript
                            let result = Function('"use strict";return (' + calcExpression + ')')();
                            // Kemudian SET hasil ke #calc-screen
                            $('#calc-screen').text(result);
                            calcExpression = result.toString();
                        }
                    } catch (e) {
                        $('#calc-screen').text("Error");
                        calcExpression = "";
                    }
                    // Jika tidak, tambahkan apapun yang diklik user ke dalam ekspresi
                } else {
                    calcExpression += btnValue;
                    $('#calc-screen').text(calcExpression);
                }
            });

            // MacPaint
            const canvas = $('#paint-canvas')[0];
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            // Setup garis yang akan digambar
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';

            // Apabila user menekan mouse di area canvas, maka isDrawing = true dan set titik mulai penggambaran
            $('#paint-canvas').on('mousedown', function (e) {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(e.offsetX, e.offsetY);
            });

            // Kemudian saat mouse bergerak dan isDrawing, gambar garis dari titik start ke titik sekarang
            $('#paint-canvas').on('mousemove', function (e) {
                if (isDrawing) {
                    ctx.lineTo(e.offsetX, e.offsetY);
                    ctx.stroke();
                }
            });

            // Jika mouse tidak menekan di area canvas maka isDrawing = false
            $(window).on('mouseup', function () {
                isDrawing = false;
            });

            // Ketika tombol #clear-canvas diklik maka bersihkan canvas
            $('#clear-canvas').on('click', function () {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        });
    </script>
</body>

</html>
