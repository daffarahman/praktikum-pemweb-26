services:
  web:
    build: .
    container_name: prakpemweb26-web
    ports:
      - "8067:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: praktikum_pemweb
      DB_USER: pemweb_user
      DB_PASS: pemweb_password
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: prakpemweb26-db
    ports:
      - "3367:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: praktikum_pemweb
      MYSQL_USER: pemweb_user
      MYSQL_PASSWORD: pemweb_password
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
